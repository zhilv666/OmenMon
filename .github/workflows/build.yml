# OmenMon Build Workflow (Simplified)
# Builds the application when a tag is pushed

name: "OmenMon Build"
run-name: "OmenMon Build by ${{ github.actor }}"

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      version_number:
        default: "0.61.1"
        description: "Version number"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: "Build OmenMon"
    runs-on: windows-2022

    steps:
    - name: "Checkout OmenMon"
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: "Extract Version"
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="${{ github.event.inputs.version_number }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: "Set up MSBuild"
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: "Restore NuGet Packages"
      working-directory: ${{ github.workspace }}
      run: nuget restore OmenMon.sln

    - name: "Build OmenMon"
      working-directory: ${{ github.workspace }}
      run: |
        msbuild OmenMon.sln `
          -p:Configuration=Release `
          -p:Platform="Any CPU" `
          -p:OutputPath=Bin\ `
          -m -noLogo

    - name: "Upload Build Artifact"
      uses: actions/upload-artifact@v4
      with:
        name: OmenMon-${{ steps.version.outputs.version }}
        path: Bin/OmenMon.exe
        if-no-files-found: error
